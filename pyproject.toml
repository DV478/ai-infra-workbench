[project]
name = "ai-infra-workbench"
version = "0.1.0"
description = "AI Compute Economics Workbench — inference cost, capacity planning, and account health"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-ulid>=2.2",
    "streamlit>=1.35",
    "plotly>=5.20",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# E501: line length — handled by formatter preference
# UP042: str+Enum mixin is required for Pydantic v2 JSON serialisation
ignore = ["E501", "UP042"]
